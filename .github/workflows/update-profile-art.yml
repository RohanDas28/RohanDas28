name: Update profile art

# Refreshes the contribution graph + stats card SVGs daily from real public data.
# Runs daily, plus on push, plus on-demand via workflow_dispatch.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: RohanDas28

      - name: Render animated contribution graph SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render streak and contribution stats card SVG
        run: python scripts/render_stats_svg.py

      - name: Render skills dashboard SVG
        run: python scripts/render_skills_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph, stats and skills [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg skills.svg"
